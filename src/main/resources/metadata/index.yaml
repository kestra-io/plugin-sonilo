group: io.kestra.plugin.sonilo
name: "sonilo"
title: "Sonilo"
description: "Generate music, sound effects, and ducked mixes with the Sonilo API."
body: |
  Tasks call the Sonilo Platform API at https://api.sonilo.com. Music can stream or run as a polled task. Sound effects and audio ducking are asynchronous. Finished audio is stored in Kestra internal storage.

  Usage of generated audio is covered by Sonilo's Terms of Service: https://sonilo.com/terms-of-service

  Platform API keys come from platform.sonilo.com and are separate from a sonilo.com app login. Sonilo has no cancel-job API, so killing a task stops only the local wait.
